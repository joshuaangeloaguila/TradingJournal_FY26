<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade Ledger</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg:#0B0E14;
    --panel:#12161F;
    --panel-raised:#161B26;
    --hairline:#232838;
    --ink:#E8E6DF;
    --ink-dim:#8A8F9C;
    --ink-faint:#565C6B;
    --gold:#D4A537;
    --gold-dim:#8A7024;
    --gain:#3FB68B;
    --gain-dim:#1F3B32;
    --loss:#E1584B;
    --loss-dim:#3B2320;
    --crypto:#7C9EFF;
  }

  html, body{
    background:#0B0E14;
    margin:0;
    padding:0;
    width:100%;
    overflow-x:hidden;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  #ledger-root{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    width:100%;
    max-width:100%;
    padding:28px 24px 60px;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  @media (max-width:600px){
    #ledger-root{padding:16px 12px 40px;}
  }

  .mono{font-family:'JetBrains Mono',monospace;}

  .lg-header{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:1px solid var(--hairline); padding-bottom:16px; margin-bottom:16px;
    flex-wrap:wrap; gap:12px;
  }
  .lg-title{font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:700; letter-spacing:0.08em; color:var(--ink);}
  .lg-title span{color:var(--gold);}
  .lg-subtitle{font-size:11px; color:var(--ink-faint); letter-spacing:0.12em; text-transform:uppercase; margin-top:4px;}
  .lg-date{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-dim); text-align:right;}

  .account-tabs{display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap;}
  .acct-tab{
    font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:0.08em; text-transform:uppercase;
    padding:9px 18px; border:1px solid var(--hairline); background:var(--panel); color:var(--ink-faint);
    cursor:pointer; display:flex; align-items:center; gap:8px; user-select:none;
    flex:1 1 auto;
    justify-content:center;
  }
  @media (max-width:600px){
    .acct-tab{padding:9px 12px; font-size:11px;}
  }
  .acct-tab .dot{width:7px; height:7px; border-radius:50%; background:var(--ink-faint);}
  .acct-tab.active{color:var(--ink); border-color:var(--gold-dim); background:var(--panel-raised);}
  .acct-tab[data-acct="crypto"].active .dot{background:var(--crypto);}
  .acct-tab[data-acct="nasdaq"].active .dot{background:var(--gold);}
  .acct-tab .acct-balance{color:var(--ink-faint); font-weight:600;}
  .acct-tab.active .acct-balance{color:var(--ink);}

  .stat-strip{
    display:grid; grid-template-columns:repeat(7,1fr); gap:1px;
    background:var(--hairline); border:1px solid var(--hairline); margin-bottom:20px; overflow-x:auto;
  }
  .stat-cell{background:var(--panel); padding:14px 16px; min-width:100px;}
  .stat-label{font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:6px;}
  .stat-value{font-family:'JetBrains Mono',monospace; font-size:18px; font-weight:600; color:var(--ink);}
  .stat-value.gain{color:var(--gain);}
  .stat-value.loss{color:var(--loss);}
  .stat-value.gold{color:var(--gold);}
  @media (max-width:900px){ .stat-strip{grid-template-columns:repeat(3,1fr);} }

  .lg-grid{display:grid; grid-template-columns:1fr; gap:20px;}
  .panel{background:var(--panel); border:1px solid var(--hairline);}
  .panel-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px; border-bottom:1px solid var(--hairline); flex-wrap:wrap; gap:8px;
  }
  .panel-head h2{font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-dim); font-weight:600;}
  .panel-body{padding:16px;}

  .balance-setting{display:flex; align-items:center; gap:8px; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-faint);}
  .balance-setting input{
    width:110px; background:var(--bg); border:1px solid var(--hairline); color:var(--gold);
    padding:5px 8px; font-family:'JetBrains Mono',monospace; font-size:12px; border-radius:2px;
  }

  #equity-svg{width:100%; height:220px; display:block;}
  .eq-empty{color:var(--ink-faint); font-size:13px; padding:40px 0; text-align:center; font-family:'JetBrains Mono',monospace;}

  .trade-form{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
  @media (max-width:900px){ .trade-form{grid-template-columns:repeat(2,1fr);} }
  .field label{display:block; font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%; background:var(--bg); border:1px solid var(--hairline); color:var(--ink);
    padding:8px 10px; font-family:'JetBrains Mono',monospace; font-size:13px; border-radius:2px; outline:none;
  }
  .field textarea{font-family:'Inter',sans-serif; font-size:13px; resize:vertical; min-height:38px;}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--gold-dim);}
  .field.span-4{grid-column:span 4;}
  @media (max-width:900px){ .field.span-4{grid-column:span 2;} }
  .field.pnl-field input{color:var(--gold); font-weight:700;}
  .field-hint{font-size:10px; color:var(--ink-faint); margin-top:4px;}

  .dir-toggle{display:flex; gap:0; border:1px solid var(--hairline); border-radius:2px; overflow:hidden;}
  .dir-btn{
    flex:1; padding:8px 0; text-align:center; cursor:pointer;
    font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:0.06em;
    background:var(--bg); color:var(--ink-faint); user-select:none;
    transition:background 0.15s, color 0.15s;
  }
  .dir-btn.active-long{background:var(--gain-dim); color:var(--gain);}
  .dir-btn.active-short{background:var(--loss-dim); color:var(--loss);}

  .form-footer{display:flex; justify-content:space-between; align-items:center; margin-top:14px;}
  .pnl-preview{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-faint);}
  .pnl-preview .val{font-weight:700;}

  .btn-add{
    background:var(--gold); color:#1A1400; border:none; padding:9px 20px;
    font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700; letter-spacing:0.06em;
    text-transform:uppercase; cursor:pointer; border-radius:2px;
  }
  .btn-add:hover{background:#E4B54A;}

  .btn-cancel-edit{
    background:none; border:1px solid var(--hairline); color:var(--ink-dim);
    padding:5px 12px; font-family:'JetBrains Mono',monospace; font-size:10px;
    letter-spacing:0.06em; text-transform:uppercase; cursor:pointer; border-radius:2px;
  }
  .btn-cancel-edit:hover{border-color:var(--loss); color:var(--loss);}

  .row-actions{display:flex; gap:10px; align-items:center;}
  .edit-btn{
    background:none; border:none; color:var(--ink-faint); cursor:pointer;
    font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:0.04em;
  }
  .edit-btn:hover{color:var(--gold);}

  .lg-table-wrap{overflow-x:auto;}
  table.lg-table{width:100%; border-collapse:collapse; font-family:'JetBrains Mono',monospace; font-size:12.5px;}
  table.lg-table th{
    text-align:left; font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-faint);
    padding:8px 10px; border-bottom:1px solid var(--hairline); white-space:nowrap;
  }
  table.lg-table td{padding:9px 10px; border-bottom:1px solid var(--hairline); color:var(--ink); white-space:nowrap;}
  table.lg-table tr:hover td{background:var(--panel-raised);}
  .tick{font-weight:700; margin-right:6px;}
  .tick.up{color:var(--gain);}
  .tick.down{color:var(--loss);}
  .pnl-cell.gain{color:var(--gain); font-weight:600;}
  .pnl-cell.loss{color:var(--loss); font-weight:600;}
  .dir-tag{font-size:10px; padding:2px 6px; border-radius:2px; letter-spacing:0.05em;}
  .dir-tag.long{background:var(--gain-dim); color:var(--gain);}
  .dir-tag.short{background:var(--loss-dim); color:var(--loss);}
  .notes-cell{
    color:var(--ink-dim); font-family:'Inter',sans-serif; font-size:12px;
    max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .del-btn{background:none; border:none; color:var(--ink-faint); cursor:pointer; font-family:'JetBrains Mono',monospace; font-size:14px;}
  .del-btn:hover{color:var(--loss);}
  .empty-row td{text-align:center; color:var(--ink-faint); padding:30px; font-family:'JetBrains Mono',monospace;}

  .filter-bar{display:flex; gap:8px; align-items:center;}
  .filter-bar select, .filter-bar input{
    background:var(--bg); border:1px solid var(--hairline); color:var(--ink-dim);
    font-family:'JetBrains Mono',monospace; font-size:11px; padding:5px 8px; border-radius:2px;
  }
</style>
</head>
<body>

<div id="ledger-root">
  <div class="lg-header">
    <div>
      <div class="lg-title">TRADE <span>LEDGER</span></div>
      <div class="lg-subtitle">personal execution &amp; risk journal</div>
    </div>
    <div class="lg-date mono" id="today-date"></div>
  </div>

  <div class="account-tabs" id="account-tabs"></div>

  <div class="stat-strip" id="stat-strip"></div>

  <div class="lg-grid">
    <div class="panel">
      <div class="panel-head">
        <h2>Balance Simulation</h2>
        <div class="balance-setting">
          <span>STARTING BALANCE</span>
          <input type="number" id="f-start-balance" step="any">
        </div>
      </div>
      <div class="panel-body">
        <div id="equity-container"></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2 id="form-heading">Log a Trade</h2>
        <button class="btn-cancel-edit" id="btn-cancel-edit" style="display:none;">Cancel edit</button>
      </div>
      <div class="panel-body">
        <div class="trade-form">
          <div class="field">
            <label>Date</label>
            <input type="date" id="f-date">
          </div>
          <div class="field">
            <label>Symbol</label>
            <input type="text" id="f-symbol" placeholder="ES, NQ, BTC...">
          </div>
          <div class="field">
            <label>Direction</label>
            <div class="dir-toggle" id="f-dir-toggle">
              <div class="dir-btn active-long" data-dir="long">LONG</div>
              <div class="dir-btn" data-dir="short">SHORT</div>
            </div>
          </div>
          <div class="field pnl-field">
            <label>P&amp;L ($)</label>
            <input type="number" id="f-pnl" placeholder="e.g. 240 or -85" step="any">
          </div>

          <div class="field">
            <label>Entry price (optional)</label>
            <input type="number" id="f-entry" placeholder="0.00" step="any">
          </div>
          <div class="field">
            <label>Exit price (optional)</label>
            <input type="number" id="f-exit" placeholder="0.00" step="any">
          </div>
          <div class="field">
            <label>Stop (optional, for R)</label>
            <input type="number" id="f-stop" placeholder="0.00" step="any">
            <div class="field-hint">R is measured in points — contract size is disregarded.</div>
          </div>
          <div class="field">
            <label>Fees (optional)</label>
            <input type="number" id="f-fees" placeholder="0.00" step="any">
          </div>

          <div class="field span-4">
            <label>Notes / setup</label>
            <textarea id="f-notes" placeholder="Setup, mistake, lesson learned..."></textarea>
          </div>
        </div>

        <div class="form-footer">
          <div class="pnl-preview">NET P&amp;L: <span class="val" id="pnl-preview-val">—</span></div>
          <button class="btn-add" id="btn-add-trade">Add to ledger</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Trade Log</h2>
        <div class="filter-bar">
          <select id="filter-outcome">
            <option value="all">All outcomes</option>
            <option value="win">Wins only</option>
            <option value="loss">Losses only</option>
          </select>
          <input type="text" id="filter-symbol" placeholder="filter symbol...">
        </div>
      </div>
      <div class="panel-body lg-table-wrap">
        <table class="lg-table">
          <thead>
            <tr>
              <th></th>
              <th>Date</th>
              <th>Symbol</th>
              <th>Dir</th>
              <th>Entry</th>
              <th>Exit</th>
              <th>P&amp;L</th>
              <th>R</th>
              <th>Balance</th>
              <th>Notes</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const TRADES_KEY = 'trades';
  const BALANCES_KEY = 'starting_balances';
  const ACCOUNTS = [
    {id:'crypto', label:'Crypto'},
    {id:'nasdaq', label:'Nasdaq'}
  ];

  let trades = [];
  let startingBalances = {crypto:0, nasdaq:0};
  let activeAccount = 'crypto';
  let currentDir = 'long';
  let editingId = null;

  const $ = (id) => document.getElementById(id);

  function todayStr(){
    return new Date().toISOString().slice(0,10);
  }

  document.getElementById('today-date').textContent =
    new Date().toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric', year:'numeric'}).toUpperCase();
  $('f-date').value = todayStr();

  // Works inside the Claude artifact viewer (window.storage) AND as a
  // standalone downloaded file opened directly in a phone/desktop browser
  // (falls back to localStorage there, since window.storage won't exist).
  const hasBridge = typeof window.storage !== 'undefined' && window.storage !== null;
  const Store = {
    async get(key){
      if(hasBridge){
        try{ return await window.storage.get(key, false); }
        catch(e){ return null; }
      }
      try{
        const raw = localStorage.getItem(key);
        return raw ? {key, value: raw} : null;
      }catch(e){ return null; }
    },
    async set(key, value){
      if(hasBridge){
        try{ return await window.storage.set(key, value, false); }
        catch(e){ console.error('storage save failed', e); return null; }
      }
      try{ localStorage.setItem(key, value); return {key, value}; }
      catch(e){ console.error('storage save failed', e); return null; }
    }
  };

  async function loadAll(){
    try{
      const res = await Store.get(TRADES_KEY);
      trades = res && res.value ? JSON.parse(res.value) : [];
    }catch(e){ trades = []; }

    try{
      const res = await Store.get(BALANCES_KEY);
      if(res && res.value){
        startingBalances = Object.assign({crypto:0, nasdaq:0}, JSON.parse(res.value));
      }
    }catch(e){ /* keep defaults */ }

    $('f-start-balance').value = startingBalances[activeAccount];
    renderTabs();
    render();
  }

  async function saveTrades(){
    await Store.set(TRADES_KEY, JSON.stringify(trades));
  }

  async function saveBalances(){
    await Store.set(BALANCES_KEY, JSON.stringify(startingBalances));
  }

  // quantity is intentionally never used — futures P&L is entered directly
  function netPnl(t){
    return (t.pnl || 0) - (t.fees || 0);
  }

  function computeR(t){
    const entry = t.entry, exit = t.exit, stop = t.stop;
    if(entry === null || exit === null || stop === null ||
       isNaN(entry) || isNaN(exit) || isNaN(stop)) return null;
    const dirMult = t.dir === 'long' ? 1 : -1;
    const riskPts = Math.abs(entry - stop);
    if(riskPts === 0) return null;
    const rewardPts = (exit - entry) * dirMult;
    return rewardPts / riskPts;
  }

  function fmtMoney(n){
    const sign = n < 0 ? '-' : '';
    return sign + '$' + Math.abs(n).toFixed(2);
  }

  function renderTabs(){
    const wrap = $('account-tabs');
    wrap.innerHTML = ACCOUNTS.map(a => {
      const acctTrades = trades.filter(t => t.account === a.id);
      const bal = startingBalances[a.id] + acctTrades.reduce((s,t) => s + netPnl(t), 0);
      return `
        <div class="acct-tab ${a.id === activeAccount ? 'active' : ''}" data-acct="${a.id}">
          <span class="dot"></span>
          <span>${a.label}</span>
          <span class="acct-balance mono">${fmtMoney(bal)}</span>
        </div>
      `;
    }).join('');

    wrap.querySelectorAll('.acct-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        activeAccount = tab.dataset.acct;
        $('f-start-balance').value = startingBalances[activeAccount];
        renderTabs();
        render();
      });
    });
  }

  $('f-start-balance').addEventListener('change', async () => {
    const v = parseFloat($('f-start-balance').value);
    startingBalances[activeAccount] = isNaN(v) ? 0 : v;
    await saveBalances();
    renderTabs();
    render();
  });

  $('f-dir-toggle').addEventListener('click', (e) => {
    const btn = e.target.closest('.dir-btn');
    if(!btn) return;
    currentDir = btn.dataset.dir;
    document.querySelectorAll('.dir-btn').forEach(b => {
      b.classList.remove('active-long','active-short');
    });
    btn.classList.add(currentDir === 'long' ? 'active-long' : 'active-short');
  });

  $('f-pnl').addEventListener('input', updatePreview);
  $('f-fees').addEventListener('input', updatePreview);

  function updatePreview(){
    const pnl = parseFloat($('f-pnl').value);
    const fees = parseFloat($('f-fees').value) || 0;
    const el = $('pnl-preview-val');
    if(isNaN(pnl)){
      el.textContent = '—';
      el.style.color = 'var(--ink-faint)';
      return;
    }
    const net = pnl - fees;
    el.textContent = fmtMoney(net);
    el.style.color = net >= 0 ? 'var(--gain)' : 'var(--loss)';
  }

  function resetForm(){
    $('f-symbol').value = '';
    $('f-pnl').value = '';
    $('f-entry').value = '';
    $('f-exit').value = '';
    $('f-stop').value = '';
    $('f-fees').value = '';
    $('f-notes').value = '';
    $('f-date').value = todayStr();
    currentDir = 'long';
    document.querySelectorAll('.dir-btn').forEach(b => b.classList.remove('active-long','active-short'));
    document.querySelector('.dir-btn[data-dir="long"]').classList.add('active-long');
    updatePreview();
  }

  function exitEditMode(){
    editingId = null;
    $('form-heading').textContent = 'Log a Trade';
    $('btn-add-trade').textContent = 'Add to ledger';
    $('btn-cancel-edit').style.display = 'none';
    resetForm();
  }

  function startEdit(id){
    const t = trades.find(tr => tr.id === id);
    if(!t) return;
    editingId = id;

    $('f-date').value = t.date;
    $('f-symbol').value = t.symbol;
    $('f-pnl').value = t.pnl;
    $('f-entry').value = t.entry === null ? '' : t.entry;
    $('f-exit').value = t.exit === null ? '' : t.exit;
    $('f-stop').value = t.stop === null ? '' : t.stop;
    $('f-fees').value = t.fees || '';
    $('f-notes').value = t.notes || '';

    currentDir = t.dir;
    document.querySelectorAll('.dir-btn').forEach(b => b.classList.remove('active-long','active-short'));
    document.querySelector('.dir-btn[data-dir="' + t.dir + '"]').classList.add(t.dir === 'long' ? 'active-long' : 'active-short');
    updatePreview();

    $('form-heading').textContent = 'Edit Trade';
    $('btn-add-trade').textContent = 'Save changes';
    $('btn-cancel-edit').style.display = 'inline-block';

    $('form-heading').scrollIntoView({behavior:'smooth', block:'center'});
  }

  $('btn-cancel-edit').addEventListener('click', exitEditMode);

  $('btn-add-trade').addEventListener('click', async () => {
    const date = $('f-date').value || todayStr();
    const symbol = $('f-symbol').value.trim().toUpperCase();
    const pnl = parseFloat($('f-pnl').value);
    const entryRaw = $('f-entry').value;
    const exitRaw = $('f-exit').value;
    const stopRaw = $('f-stop').value;
    const entry = entryRaw === '' ? null : parseFloat(entryRaw);
    const exit = exitRaw === '' ? null : parseFloat(exitRaw);
    const stop = stopRaw === '' ? null : parseFloat(stopRaw);
    const fees = parseFloat($('f-fees').value) || 0;
    const notes = $('f-notes').value.trim();

    if(!symbol || isNaN(pnl)){
      alert('Fill in a symbol and the trade P&L to log it.');
      return;
    }

    if(editingId){
      const idx = trades.findIndex(t => t.id === editingId);
      if(idx !== -1){
        trades[idx] = {
          ...trades[idx],
          date, symbol, dir: currentDir, pnl, entry, exit, stop, fees, notes
        };
      }
      await saveTrades();
      exitEditMode();
    } else {
      const trade = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
        account: activeAccount,
        date, symbol, dir: currentDir, pnl, entry, exit, stop, fees, notes
      };
      trades.push(trade);
      await saveTrades();
      resetForm();
    }

    renderTabs();
    render();
  });

  async function deleteTrade(id){
    if(id === editingId) exitEditMode();
    trades = trades.filter(t => t.id !== id);
    await saveTrades();
    renderTabs();
    render();
  }

  $('filter-outcome').addEventListener('change', render);
  $('filter-symbol').addEventListener('input', render);

  function renderStats(enriched, startBal, endBal){
    const strip = $('stat-strip');
    if(enriched.length === 0){
      strip.innerHTML = `
        <div class="stat-cell"><div class="stat-label">Balance</div><div class="stat-value mono gold">${fmtMoney(startBal)}</div></div>
        <div class="stat-cell"><div class="stat-label">Trades</div><div class="stat-value mono">0</div></div>
        <div class="stat-cell"><div class="stat-label">Net P&amp;L</div><div class="stat-value mono">—</div></div>
        <div class="stat-cell"><div class="stat-label">Win rate</div><div class="stat-value mono">—</div></div>
        <div class="stat-cell"><div class="stat-label">Gross win</div><div class="stat-value mono">—</div></div>
        <div class="stat-cell"><div class="stat-label">Gross loss</div><div class="stat-value mono">—</div></div>
        <div class="stat-cell"><div class="stat-label">Avg R</div><div class="stat-value mono">—</div></div>
      `;
      return;
    }

    const total = enriched.length;
    const wins = enriched.filter(t => t.net > 0);
    const losses = enriched.filter(t => t.net < 0);
    const netPnlTotal = enriched.reduce((s,t) => s + t.net, 0);
    const winRate = (wins.length / total) * 100;
    const grossWin = wins.reduce((s,t) => s + t.net, 0);
    const grossLoss = Math.abs(losses.reduce((s,t) => s + t.net, 0));
    const rTrades = enriched.filter(t => t.r !== null);
    const avgR = rTrades.length ? rTrades.reduce((s,t) => s + t.r, 0) / rTrades.length : null;

    strip.innerHTML = `
      <div class="stat-cell">
        <div class="stat-label">Balance</div>
        <div class="stat-value mono gold">${fmtMoney(endBal)}</div>
      </div>
      <div class="stat-cell">
        <div class="stat-label">Trades</div>
        <div class="stat-value mono">${total} <span style="font-size:11px; color:var(--ink-faint);">(${wins.length}W / ${losses.length}L)</span></div>
      </div>
      <div class="stat-cell">
        <div class="stat-label">Net P&amp;L</div>
        <div class="stat-value mono ${netPnlTotal >= 0 ? 'gain' : 'loss'}">${fmtMoney(netPnlTotal)}</div>
      </div>
      <div class="stat-cell">
        <div class="stat-label">Win rate</div>
        <div class="stat-value mono gold">${winRate.toFixed(0)}%</div>
      </div>
      <div class="stat-cell">
        <div class="stat-label">Gross win</div>
        <div class="stat-value mono gain">${fmtMoney(grossWin)}</div>
      </div>
      <div class="stat-cell">
        <div class="stat-label">Gross loss</div>
        <div class="stat-value mono loss">-${fmtMoney(grossLoss)}</div>
      </div>
      <div class="stat-cell">
        <div class="stat-label">Avg R</div>
        <div class="stat-value mono ${avgR === null ? '' : (avgR >= 0 ? 'gain' : 'loss')}">${avgR === null ? '—' : avgR.toFixed(2) + 'R'}</div>
      </div>
    `;
  }

  function renderEquity(chrono, startBal){
    const container = $('equity-container');
    if(chrono.length === 0){
      container.innerHTML = '<div class="eq-empty">No trades logged for this account yet — the balance curve will appear here.</div>';
      return;
    }

    let bal = startBal;
    const points = [bal];
    chrono.forEach(t => { bal += t.net; points.push(bal); });

    const w = 1000, h = 220, padX = 10, padY = 20;
    const minV = Math.min(...points);
    const maxV = Math.max(...points);
    const range = (maxV - minV) || 1;

    const stepX = (w - padX*2) / (points.length - 1 || 1);
    const scaleY = (v) => h - padY - ((v - minV) / range) * (h - padY*2);

    const coords = points.map((v,i) => [padX + i*stepX, scaleY(v)]);
    const linePath = coords.map((c,i) => (i===0 ? 'M' : 'L') + c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ');
    const startY = scaleY(startBal).toFixed(1);
    const areaPath = linePath + ` L${coords[coords.length-1][0].toFixed(1)},${startY} L${coords[0][0].toFixed(1)},${startY} Z`;

    const finalUp = points[points.length-1] >= startBal;
    const lineColor = finalUp ? 'var(--gain)' : 'var(--loss)';

    container.innerHTML = `
      <svg id="equity-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
        <line x1="${padX}" y1="${startY}" x2="${w-padX}" y2="${startY}" stroke="var(--hairline)" stroke-width="1" stroke-dasharray="4 4"/>
        <path d="${areaPath}" fill="${lineColor}" opacity="0.08"/>
        <path d="${linePath}" fill="none" stroke="${lineColor}" stroke-width="2"/>
        ${coords.map((c,i) => `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="${i===coords.length-1 ? 3.5 : 2}" fill="${lineColor}"/>`).join('')}
      </svg>
    `;
  }

  function renderTable(chrono, startBal){
    const body = $('table-body');
    const outcomeFilter = $('filter-outcome').value;
    const symbolFilter = $('filter-symbol').value.trim().toUpperCase();

    let bal = startBal;
    const withBalance = chrono.map(t => { bal += t.net; return {...t, runningBalance: bal}; });
    let rows = [...withBalance].sort((a,b) => new Date(b.date) - new Date(a.date));

    if(outcomeFilter === 'win') rows = rows.filter(t => t.net > 0);
    if(outcomeFilter === 'loss') rows = rows.filter(t => t.net < 0);
    if(symbolFilter) rows = rows.filter(t => t.symbol.includes(symbolFilter));

    if(rows.length === 0){
      body.innerHTML = `<tr class="empty-row"><td colspan="11">No trades match. Log one above, or adjust filters.</td></tr>`;
      return;
    }

    body.innerHTML = rows.map(t => {
      const up = t.net >= 0;
      return `
        <tr>
          <td><span class="tick ${up ? 'up' : 'down'}">${up ? '▲' : '▼'}</span></td>
          <td>${t.date}</td>
          <td>${t.symbol}</td>
          <td><span class="dir-tag ${t.dir}">${t.dir.toUpperCase()}</span></td>
          <td>${t.entry === null ? '—' : t.entry}</td>
          <td>${t.exit === null ? '—' : t.exit}</td>
          <td class="pnl-cell ${up ? 'gain' : 'loss'}">${fmtMoney(t.net)}</td>
          <td>${t.r === null ? '—' : t.r.toFixed(2) + 'R'}</td>
          <td>${fmtMoney(t.runningBalance)}</td>
          <td class="notes-cell" title="${(t.notes||'').replace(/"/g,'&quot;')}">${t.notes || '—'}</td>
          <td>
            <div class="row-actions">
              <button class="edit-btn" data-id="${t.id}" title="Edit trade">EDIT</button>
              <button class="del-btn" data-id="${t.id}" title="Delete trade">✕</button>
            </div>
          </td>
        </tr>
      `;
    }).join('');

    body.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', () => deleteTrade(btn.dataset.id));
    });
    body.querySelectorAll('.edit-btn').forEach(btn => {
      btn.addEventListener('click', () => startEdit(btn.dataset.id));
    });
  }

  function render(){
    const acctTrades = trades.filter(t => t.account === activeAccount);
    const enriched = acctTrades.map(t => ({...t, net: netPnl(t), r: computeR(t)}));
    const chrono = [...enriched].sort((a,b) => new Date(a.date) - new Date(b.date));
    const startBal = startingBalances[activeAccount] || 0;
    const endBal = startBal + enriched.reduce((s,t) => s + t.net, 0);

    renderStats(enriched, startBal, endBal);
    renderEquity(chrono, startBal);
    renderTable(chrono, startBal);
  }

  updatePreview();
  loadAll();
})();
</script>
</body>
</html>
